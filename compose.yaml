services:
  besu-iou-app:
    container_name: besu-iou-app
    build:
      context: .
      dockerfile: Dockerfile
    image: besu-iou:latest
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      BESU_RPC_URL: "${BESU_RPC_URL:-http://host.docker.internal:8545}"
      BESU_CHAIN_ID: "${BESU_CHAIN_ID:-1337}"
      BESU_PRIVATE_KEY: "${BESU_PRIVATE_KEY:-}"
      BESU_CONTRACT_ADDRESS: "${BESU_CONTRACT_ADDRESS:-}"
      BESU_CONTRACT_BINARY: "${BESU_CONTRACT_BINARY:-}"
      BESU_GAS_PRICE: "${BESU_GAS_PRICE:-0}"
      BESU_GAS_LIMIT: "${BESU_GAS_LIMIT:-6000000}"
      BESU_RECEIPT_ATTEMPTS: "${BESU_RECEIPT_ATTEMPTS:-40}"
      BESU_RECEIPT_SLEEP_MILLIS: "${BESU_RECEIPT_SLEEP_MILLIS:-500}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
