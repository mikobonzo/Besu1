spring.application.name=besu-iou
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
besu.rpc-url=${BESU_RPC_URL:http://localhost:8545}
besu.chain-id=${BESU_CHAIN_ID:1337}
besu.private-key=${BESU_PRIVATE_KEY:}
besu.contract-address=${BESU_CONTRACT_ADDRESS:}
besu.contract-binary=${BESU_CONTRACT_BINARY:}
besu.gas-price=${BESU_GAS_PRICE:0}
besu.gas-limit=${BESU_GAS_LIMIT:6000000}
besu.receipt-attempts=${BESU_RECEIPT_ATTEMPTS:40}
besu.receipt-sleep-millis=${BESU_RECEIPT_SLEEP_MILLIS:500}
